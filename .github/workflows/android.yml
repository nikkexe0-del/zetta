name: Android CI

env:
  main_project_module: app

permissions: {}

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'corretto'
        cache: 'gradle'

    - name: Create Blank Local Properties File
      run: touch local.properties
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Sub-version = the GitHub run number, so every push produces a new,
    # incrementing version (1.8.9.<run>) without editing build.gradle by hand.
    - name: Compute version
      run: |
        MAJOR=$(grep -oP 'def versionMajor\s*=\s*\K[0-9]+' ${{ env.main_project_module }}/build.gradle)
        MINOR=$(grep -oP 'def versionMinor\s*=\s*\K[0-9]+' ${{ env.main_project_module }}/build.gradle)
        PATCH=$(grep -oP 'def versionPatch\s*=\s*\K[0-9]+' ${{ env.main_project_module }}/build.gradle)
        BUILD=${{ github.run_number }}
        echo "VERSION_BUILD=$BUILD" >> $GITHUB_ENV
        echo "VERSION_NAME=$MAJOR.$MINOR.$PATCH.$BUILD" >> $GITHUB_ENV

    # Build ONLY the arm64-v8a github release APK. No other ABIs, no FOSS flavor.
    - name: Build arm64-v8a release APK
      run: ./gradlew assembleGithubRelease -PabiFilter=arm64-v8a -PversionBuild=${{ env.VERSION_BUILD }} --warning-mode all

    - name: Locate and rename APK
      run: |
        SRC=$(find ${{ env.main_project_module }}/build/outputs/apk/github/release/ -type f -name '*arm64*.apk' | head -n 1)
        echo "Found APK: $SRC"
        mkdir -p release-assets
        cp "$SRC" "release-assets/zetta-${{ env.VERSION_NAME }}.apk"
        ls -lh release-assets/

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: zetta-${{ env.VERSION_NAME }}
        path: release-assets/zetta-${{ env.VERSION_NAME }}.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ env.VERSION_NAME }}
        name: zetta ${{ env.VERSION_NAME }}
        generate_release_notes: true
        files: release-assets/zetta-${{ env.VERSION_NAME }}.apk
