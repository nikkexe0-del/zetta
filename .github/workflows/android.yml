name: Build & Publish zetta (arm64-v8a)

env:
  main_project_module: app

permissions: {}

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # required so the release can actually be created / uploaded
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Create blank local.properties
        run: touch local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ------------------------------------------------------------------
      # Signing. Uses repo secrets when present, otherwise generates a
      # throwaway key so the APK is at least installable (an unsigned APK
      # cannot be installed on a device).
      # ------------------------------------------------------------------
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/zetta.jks"
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "No KEYSTORE_BASE64 secret found, generating a throwaway key."
            STORE_PASS="zettazetta"
            ALIAS="zetta"
            KEY_PASS="zettazetta"
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/zetta.jks" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=zetta, OU=zetta, O=zetta, L=NA, S=NA, C=IN"
          fi
          cat > keystore.properties <<PROPS
          signingConfig.storeFile=$GITHUB_WORKSPACE/zetta.jks
          signingConfig.storePassword=$STORE_PASS
          signingConfig.keyAlias=$ALIAS
          signingConfig.keyPassword=$KEY_PASS
          PROPS

      # ------------------------------------------------------------------
      # Build ONLY the arm64-v8a github release APK
      # ------------------------------------------------------------------
      - name: Build arm64-v8a github release APK
        run: ./gradlew assembleGithubRelease -PzettaAbi=arm64-v8a --warning-mode all

      - name: Locate the APK and read the version
        id: apk
        run: |
          APK_PATH=$(find ${{ env.main_project_module }}/build/outputs/apk/github/release/ -type f -name '*arm64-v8a*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No arm64-v8a APK was produced."
            find ${{ env.main_project_module }}/build/outputs/apk -type f -name '*.apk' || true
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          # zetta-<version>-github-arm64-v8a-release.apk
          VERSION=$(echo "$APK_NAME" | sed -E 's/^zetta-(.*)-github-arm64-v8a-release\.apk$/\1/')
          echo "apk_path=$APK_PATH"   >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME"   >> $GITHUB_OUTPUT
          echo "version=$VERSION"     >> $GITHUB_OUTPUT
          echo "Built $APK_NAME (version $VERSION)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetta-arm64-v8a-github-release
          path: ${{ steps.apk.outputs.apk_path }}

      # ------------------------------------------------------------------
      # Publish. This is the step that was missing: without it the APK only
      # ever existed as a workflow artifact and never reached the releases page.
      # ------------------------------------------------------------------
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: zetta ${{ steps.apk.outputs.version }}
          body: |
            zetta ${{ steps.apk.outputs.version }} — arm64-v8a

            Built from `${{ github.sha }}`.

            **Asset:** `${{ steps.apk.outputs.apk_name }}`
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
          make_latest: true
          # replaces the asset if the tag already exists, so re-runs work
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
